// mozilla.cfg 第一行必须是注释。放到 Firefox 安装目录根下（与 firefox.exe 同级）。
// 作用：移除 Ctrl+N（新建窗口）这个保留快捷键，让网页能收到 Ctrl+N。
try {
  Services.obs.addObserver((win) => {
    win.addEventListener('DOMContentLoaded', () => {
      if (win.location.href !== 'chrome://browser/content/browser.xhtml') return;
      const k = win.document.getElementById('key_newNavigator');
      if (k) k.remove();
    }, { once: true });
  }, 'chrome-document-global-created');
} catch (e) {
  Components.utils.reportError(e);
}
