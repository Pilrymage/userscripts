<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>readline 视觉行测试页</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #fff; }
  .box { margin: 8px; }
  textarea { font: 16px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; width: 320px; height: 160px; padding: 4px 6px; border: 1px solid #888; }
  textarea.mono { font: 14px/20px Consolas, monospace; width: 260px; }
  textarea.narrow { width: 120px; }
  div.rich { font: 16px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; width: 320px; min-height: 40px; padding: 4px; border: 1px solid #ccc; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="box"><textarea id="t1" class="mono"></textarea></div>
<div class="box"><textarea id="t2"></textarea></div>
<div class="box"><textarea id="t3" class="narrow"></textarea></div>
<div class="box"><textarea id="t4"></textarea></div>
<div class="box"><div id="r1" class="rich" contenteditable="true"></div></div>
</body>
</html>
